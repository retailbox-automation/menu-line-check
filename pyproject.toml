[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decider-kit"
version = "0.1.0"
description = "Concept-agnostic toolkit for putting Strands Decider 2B decisions behind a Strands InterventionHandler."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Mikhail Oskola" }]
dependencies = [
  "strands-agents==1.61.1",
  "httpx>=0.27",
  "pydantic>=2",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
decider-bench = "decider_kit.bench:main"

[tool.hatch.build.targets.wheel]
packages = ["src/decider_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "patterns"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
